[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hubspot-customer-success-agents"
version = "1.0.0"
description = "Customer Success agents that score account health, open renewals, follow up and prepare QBRs inside HubSpot"
license = "MIT"
authors = [{ name = "Alex Kurinets" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "numpy>=2.0",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.2,<4",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.66", "pandas>=2.2", "altair>=5.4"]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
csagents = "csagents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
csagents = ["schema.sql"]
hubspot_mock = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 135
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
