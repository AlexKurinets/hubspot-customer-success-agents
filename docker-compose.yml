name: hubspot-cs-agents

x-app: &app
  build: .
  image: hubspot-cs-agents:local
  environment: &env
    DATABASE_URL: postgresql://cs:cs@db:5432/cs
    HUBSPOT_URL: http://hubspot:8150
    HUBSPOT_TOKEN: ${HUBSPOT_TOKEN:-pat-demo-cs-agents}
    HUBSPOT_CLIENT_SECRET: ${HUBSPOT_CLIENT_SECRET:-demo-client-secret}
    HUBSPOT_APP_ID: "4100217"
    APPROVER_TOKEN: ${APPROVER_TOKEN:-demo-csm}
    LLM_PROVIDER: ${LLM_PROVIDER:-offline}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    CS_LLM_MODEL: ${CS_LLM_MODEL:-claude-sonnet-5-5}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cs
      POSTGRES_PASSWORD: cs
      POSTGRES_DB: cs
    ports:
      - "${POSTGRES_PORT:-5490}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs -d cs"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The HubSpot stand-in. Its burst limit is raised so the five-month backfill finishes in minutes;
  # the client paces itself to whatever limit the rate-limit headers report, as it did against HubSpot.
  hubspot:
    <<: *app
    command: uvicorn --factory hubspot_mock.app:create_app --host 0.0.0.0 --port 8150
    environment:
      <<: *env
      MOCK_BURST_LIMIT: ${MOCK_BURST_LIMIT:-2000}
      MOCK_WEBHOOK_TARGET: http://api:8151/webhooks/hubspot
      MOCK_WEBHOOK_INTERVAL: "2"
      MOCK_WEBHOOK_DUPLICATE_PERCENT: "3"
    ports:
      - "${HUBSPOT_PORT:-8150}:8150"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8150/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    <<: *app
    command: uvicorn --factory csagents.api:create_app --host 0.0.0.0 --port 8151
    ports:
      - "${API_PORT:-8151}:8151"
    depends_on:
      hubspot:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8151/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  # On first start the worker builds the synthetic portal and runs 2 February to 30 June 2026 one business
  # day at a time (about ten minutes), then handles webhooks and answered approvals every five seconds.
  worker:
    <<: *app
    command: sh -c "csagents seed --if-empty && touch /tmp/seeded && exec csagents worker --interval 5"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/seeded"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 1500s

  dashboard:
    <<: *app
    command: >-
      streamlit run dashboard/app.py --server.port 8550 --server.address 0.0.0.0 --server.headless true
      --browser.gatherUsageStats false
    environment:
      <<: *env
      API_URL: http://api:8151
    ports:
      - "${DASHBOARD_PORT:-8550}:8550"
    depends_on:
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8550/_stcore/health')"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
